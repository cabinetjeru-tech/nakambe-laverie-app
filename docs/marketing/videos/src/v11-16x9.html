<!doctype html><html><head><meta charset="utf-8"><title>Vidéo NLA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Figtree:wght@700;800&display=swap">
<style>

  body.pub{--c:#0F4A9C;--c2:#0A3573;--hl:#8FD3F5}

    #0F4A9C 0 38px,#FFFFFF 38px 42px,#0F4A9C 42px 60px,#D9A521 60px 66px,#1E9BD7 66px 96px,#0A3573 96px 100px,
    #1E9BD7 100px 112px,#FFFFFF 112px 116px,#3D9A4F 116px 140px,#D9A521 140px 146px,#3D9A4F 146px 156px,#FFFFFF 156px 160px)}
  .stripe.t{top:0}.stripe.b{bottom:0}
  .top{position:absolute;display:flex;align-items:center;gap:18px;z-index:4}
  .top .lg{width:84px;height:84px;border-radius:50%;background:#fff;overflow:hidden;flex:none}
  .top .lg img{width:100%;height:100%;object-fit:cover}
  .top .nm{font:800 26px/1.1 Unbounded,"Arial Black",sans-serif;letter-spacing:.02em}
  .top .sr{font:800 22px Figtree,Arial,sans-serif;background:rgba(255,255,255,.16);padding:4px 14px;border-radius:999px;margin-top:6px;display:inline-block}

  .item:first-child{background:#D9A521;color:#141A2E}
  .kick{font:800 34px Figtree,Arial,sans-serif;color:var(--hl);text-transform:uppercase;letter-spacing:.08em}

<script>
  const PEOPLE = {
    awa:    { name: "Maman Awa",    skin: "#6B3E26", shade: "#55301D", style: "wrap",   cloth: "#0A3573", cloth2: "#1E9BD7", wrap: "#D9A521", wrap2: "#0F4A9C" },
    issouf: { name: "Tonton Issouf", skin: "#4E2C1B", shade: "#3C2114", style: "kufi",   cloth: "#F4F1E8", cloth2: "#6A2C70", wrap: "#6A2C70", wrap2: "#F4F1E8" },
    kader:  { name: "Kader",        skin: "#8A5634", shade: "#6E4228", style: "cap",    cloth: "#0F4A9C", cloth2: "#1E9BD7", wrap: "#D9A521", wrap2: "#0A3573" },
    fati:   { name: "Fati",         skin: "#5C3520", shade: "#472817", style: "braids", cloth: "#0A3573", cloth2: "#1E9BD7", wrap: "#1A1210", wrap2: "#0F4A9C" }
  };

  function avatar(id, cls) {
    const p = PEOPLE[id];
    const hair = {
      wrap: `<path d="M28 54 C22 22 48 8 62 14 C82 6 102 26 92 54 C84 38 40 36 28 54Z" fill="${p.wrap}"/>
             <path d="M34 40 C50 30 74 30 88 40" stroke="${p.wrap2}" stroke-width="4" fill="none"/>
             <path d="M32 48 C50 36 74 36 90 48" stroke="${p.wrap2}" stroke-width="3" fill="none" opacity=".7"/>
             <ellipse cx="86" cy="18" rx="12" ry="9" fill="${p.wrap}"/><circle cx="86" cy="18" r="4" fill="${p.wrap2}"/>`,
      kufi: `<path d="M37 42 C37 20 83 20 83 42Z" fill="${p.wrap}"/>
             <path d="M40 34 H80" stroke="${p.wrap2}" stroke-width="2" stroke-dasharray="3 3"/>`,
      cap:  `<path d="M36 44 C35 20 85 20 84 44Z" fill="${p.wrap}"/>
             <path d="M60 40 L104 43 C104 48 100 50 96 50 L60 46Z" fill="${p.wrap2}"/>
             <circle cx="60" cy="32" r="5" fill="#fff"/><circle cx="60" cy="32" r="2.5" fill="#1E9BD7"/>`,
      braids: `<path d="M34 50 C30 20 90 20 86 50 L90 96 L82 96 L80 58 L40 58 L38 96 L30 96Z" fill="${p.wrap}"/>
             <circle cx="84" cy="44" r="10" fill="${p.wrap}"/>`
    }[p.style];
    const extra = {
      wrap: `<circle cx="36" cy="66" r="3" fill="#E9A21A"/><circle cx="84" cy="66" r="3" fill="#E9A21A"/>`,
      kufi: `<g stroke="#141A2E" stroke-width="2" fill="rgba(255,255,255,.15)"><circle cx="50" cy="58" r="7"/><circle cx="70" cy="58" r="7"/><path d="M57 58 H63"/></g>
             <path d="M42 70 C44 86 52 90 60 90 C68 90 76 86 78 70 C72 78 48 78 42 70Z" fill="#9A9A9A"/>`,
      cap:  ``,
      braids: `<path d="M35 44 C34 20 86 20 85 44Z" fill="${p.wrap2}"/><path d="M60 40 L102 43 C102 48 98 50 94 50 L60 46Z" fill="#0A3573"/>
             <circle cx="60" cy="33" r="5" fill="#fff"/><circle cx="60" cy="33" r="2.5" fill="#1E9BD7"/>
             <circle cx="37" cy="67" r="3.5" fill="#D9A521"/><circle cx="83" cy="67" r="3.5" fill="#D9A521"/>`
    }[p.style];
    const mouth = p.style === "kufi"
      ? `<path d="M53 74 Q60 79 67 74" stroke="#2A140B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
      : `<path d="M51 72 Q60 81 69 72 Z" fill="#fff" stroke="#2A140B" stroke-width="2" stroke-linejoin="round"/>`;
    return `<svg class="${cls || ""}" viewBox="0 0 120 120" role="img" aria-label="${p.name}" xmlns="http://www.w3.org/2000/svg">
      ${p.style === "braids" ? hair : ""}
      <path d="M12 120 C16 94 40 86 60 86 C80 86 104 94 108 120Z" fill="${p.cloth}"/>
      <path d="M44 88 L60 104 L76 88" stroke="${p.cloth2}" stroke-width="4" fill="none"/>
      <circle cx="30" cy="108" r="3" fill="${p.cloth2}"/><circle cx="90" cy="108" r="3" fill="${p.cloth2}"/><circle cx="60" cy="115" r="3" fill="${p.cloth2}"/>
      <rect x="51" y="72" width="18" height="18" rx="6" fill="${p.shade}"/>
      <circle cx="36" cy="60" r="6" fill="${p.shade}"/><circle cx="84" cy="60" r="6" fill="${p.shade}"/>
      <ellipse cx="60" cy="57" rx="24" ry="27" fill="${p.skin}"/>
      <path d="M45 50 Q50 47 55 50 M65 50 Q70 47 75 50" stroke="#1A0D07" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="58" rx="3.2" ry="3.8" fill="#1A0D07"/><ellipse cx="70" cy="58" rx="3.2" ry="3.8" fill="#1A0D07"/>
      <circle cx="51" cy="57" r="1" fill="#fff"/><circle cx="71" cy="57" r="1" fill="#fff"/>
      <path d="M58 60 Q60 67 62 60" stroke="${p.shade}" stroke-width="2" fill="none"/>
      ${mouth}
      ${p.style !== "braids" ? hair : ""}
      ${extra}
    </svg>`;
  }


window.VIDEO={"id": "v11", "series": "auto", "title": "Harmattan : protéger la carrosserie de la poussière", "date": "Mercredi 28 octobre", "vertical": false, "rows": [{"chap": null, "who": null, "voice": "(générique)", "visual": "Logo NLA animé, jingle.", "ecran": null, "s": 4}, {"chap": null, "who": "Kader", "voice": "L'harmattan arrive. Le matin, ta voiture est couverte d'une couche de poussière. Tu passes un coup de chiffon, et quelques semaines plus tard, la peinture est terne et pleine de fines rayures. Aujourd'hui, je te donne les bons réflexes pour traverser la saison sèche sans abîmer ta carrosserie.", "visual": "Voiture couverte de poussière fine au lever du soleil. Kader en incrustation.", "ecran": null, "s": null}, {"chap": "Pourquoi la poussière abîme", "who": null, "voice": "D'abord, il faut savoir une chose : la poussière de l'harmattan, ce sont de minuscules grains de sable. Chaque fois que tu les frottes sur la peinture, tu fais de petites rayures. Une seule fois, ça ne se voit pas. Tous les jours pendant trois mois, si.", "visual": "Macro sur des grains de poussière. Doigt qui glisse, trace fine.\nPOUSSIÈRE = SABLE FIN", "ecran": "POUSSIÈRE = SABLE FIN", "s": null}, {"chap": "Réflexe 1 · Ne jamais essuyer à sec", "who": null, "voice": "Premier réflexe : ne jamais essuyer la poussière à sec. Pas de chiffon, pas de plumeau, pas la main. On rince à grande eau, ou on utilise un nettoyant sans rinçage avec une microfibre propre, en passant doucement dans un seul sens, et en retournant souvent la microfibre.", "visual": "Chiffon sec barré. Puis rinçage à grande eau. Microfibre passée dans un seul sens.\n1. JAMAIS À SEC", "ecran": "1. JAMAIS À SEC", "s": null}, {"chap": "Réflexe 2 · Le pare-brise", "who": null, "voice": "Deuxième réflexe : le pare-brise. N'allume jamais les essuie-glaces sur un pare-brise poussiéreux et sec : ils rayent la vitre et s'usent. Utilise d'abord le lave-glace, et garde le réservoir toujours rempli pendant la saison.", "visual": "Essuie-glaces sur vitre poussiéreuse, barré. Lave-glace qui gicle, puis essuie-glaces.\n2. LAVE-GLACE D'ABORD", "ecran": "2. LAVE-GLACE D'ABORD", "s": null}, {"chap": "Réflexe 3 · Garer à l'abri", "who": null, "voice": "Troisième réflexe : garer à l'abri. Un garage, un hangar, ou au moins une housse de voiture. Attention : la housse se pose sur une voiture propre, sinon elle frotte la poussière sur la peinture à chaque coup de vent.", "visual": "Voiture sous abri. Housse posée sur voiture propre.\n3. ABRI OU HOUSSE SUR VOITURE PROPRE", "ecran": "3. ABRI OU HOUSSE SUR VOITURE PROPRE", "s": null}, {"chap": "Réflexe 4 · Protéger la peinture", "who": null, "voice": "Quatrième réflexe : protéger la peinture avant la saison. Après un lavage complet, on applique une cire de protection. Elle fait une couche lisse : la poussière accroche moins, et elle part plus facilement au rinçage.", "visual": "Application de cire en mouvements circulaires, puis gouttes d'eau qui perlent.\n4. CIRE DE PROTECTION", "ecran": "4. CIRE DE PROTECTION", "s": null}, {"chap": "Réflexe 5 · Sous le capot", "who": null, "voice": "Et n'oublie pas ce qu'on ne voit pas. La poussière bouche le filtre à air du moteur et le filtre de la climatisation. Pendant l'harmattan, fais-les contrôler plus souvent par ton mécanicien.", "visual": "Filtre à air encrassé à côté d'un filtre neuf.\n5. FILTRES CONTRÔLÉS", "ecran": "5. FILTRES CONTRÔLÉS", "s": null}, {"chap": "Réflexe 5 · Sous le capot", "who": null, "voice": "On résume : jamais à sec, lave-glace avant les essuie-glaces, un abri, une cire de protection, et les filtres contrôlés. Et pour un lavage qui ne raye pas, passe à la Nouvelle Laverie Africaine. Abonne-toi, et bonne saison sèche !", "visual": "Récapitulatif. Logo, numéros, bouton « S'abonner ».", "ecran": null, "s": null}]};
const V = window.VIDEO;
const SERIES = {laverie:"Astuces laverie",pressing:"Pressing pro",auto:"Auto-Moto Clean",formation:"Académie NLA",pub:"Nos services"};
const WHO = {"Maman Awa":"awa","Tonton Issouf":"issouf","Kader":"kader","Fati":"fati"};
const $ = id => document.getElementById(id);
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nb = s => s.replace(/(^|\s)(\d+\.) /g, "$1$2\u00a0").replace(/ ([?!:;»=])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
const W = s => (s.match(/[\p{L}\p{N}'’-]+/gu) || []).length;
document.body.classList.add(V.vertical ? "V" : "H", V.series);
$("seriesLabel").textContent = SERIES[V.series];

function av(id){
  return avatar(id)
    .replace('<path d="M51 72 Q60 81 69 72 Z"', '<path class="mouth" d="M51 72 Q60 81 69 72 Z"')
    .replace('<path d="M53 74 Q60 79 67 74"', '<path class="mouth" d="M53 74 Q60 79 67 74"')
    .replace('<ellipse cx="50" cy="58"', '<ellipse class="eye" cx="50" cy="58"')
    .replace('<ellipse cx="70" cy="58"', '<ellipse class="eye" cx="70" cy="58"');
}
const mainWho = WHO[(V.rows.find(r => r.who) || {}).who] || "fati";
$("av").insertAdjacentHTML("beforeend", av(mainWho) + `<span class="tag">${[...Object.entries(WHO)].find(e=>e[1]===mainWho)[0]}</span>`);
const hasGuest = V.id === "v06";
if (hasGuest) $("guest").innerHTML = av("kader") + `<span class="tag">Le client</span>`;

// ---------- timeline ----------
const isLong = V.rows.some(r => r.s);
const chapters = [...new Set(V.rows.map(r => r.chap).filter(Boolean))];
let t = 0;
const SC = [];
V.rows.forEach((r, i) => {
  const d = r.s ? r.s : Math.max(2.6, W(r.voice) / 150 * 60 + 0.8);
  const last = i === V.rows.length - 1;
  let type = "text";
  if (r.s) type = "intro";
  else if (/Récapitulatif/i.test(r.visual)) type = "recap";
  else if (last && !r.ecran) type = "cta";
  else if (/tricycle/i.test(r.voice) && !r.ecran) type = "tricycle";
  else if (V.id === "v09" && r.ecran) type = "phone";
  else if (V.id === "v09" && /Capture/.test(r.visual)) type = "phone";
  SC.push({ ...r, i, a: t, b: t + d, type, last, guest: hasGuest && /Kader/.test(r.visual) });
  t += d;
});
const OUT = isLong ? 15 : 0;
const TOTAL = t + OUT;
window.TOTAL = TOTAL;

// subtitles
const SUBS = [];
SC.forEach(s => {
  if (s.type === "intro" || !s.voice || /^\(/.test(s.voice)) return;
  let parts = s.voice.match(/[^.!?…]+[.!?…]*[»"]?\s*/g) || [s.voice];
  let chunks = [];
  parts.forEach(p => {
    p = p.trim(); if (!p) return;
    let words = p.split(/\s+/);
    if (words.length <= 14) { chunks.push(p); return; }
    // split on commas first, then by 12 words
    let sub = p.split(/(?<=,)\s+/); let cur = [];
    sub.forEach(x => { const n = x.split(/\s+/).length; if (cur.join(" ").split(/\s+/).length + n > 14 && cur.length) { chunks.push(cur.join(" ")); cur = []; } cur.push(x); });
    if (cur.length) chunks.push(cur.join(" "));
  });
  chunks = chunks.flatMap(c => { const w = c.split(/\s+/); if (w.length <= 16) return [c]; const o = []; for (let k = 0; k < w.length; k += 12) o.push(w.slice(k, k + 12).join(" ")); return o; });
  const total = chunks.reduce((n, c) => n + W(c), 0) || 1;
  const span = (s.b - s.a) - 0.6;
  let x = s.a + 0.2;
  chunks.forEach(c => { const d = span * W(c) / total; SUBS.push({ a: x, b: x + d, text: nb(c) }); x += d; });
});

// ---------- build scenes ----------
const stage = $("stage");
const IMG = "../../assets/";
function ecranHTML(e){
  const items = e.split(/\s·\s/);
  if (items.length > 1) return `<div class="items">${items.map(x => `<div class="item">${esc(nb(x))}</div>`).join("")}</div>`;
  return `<div class="big">${esc(nb(e))}</div>`;
}
SC.forEach(s => {
  const el = document.createElement("div"); el.className = "scene"; s.el = el;
  const kick = s.chap ? `<div class="kick">${esc(s.chap.split(" · ")[0])}</div>` : "";
  if (s.type === "intro") { el.innerHTML = ""; }
  else if (s.type === "recap") {
    el.innerHTML = `<div class="kick">On résume</div><div class="recap">${chapters.filter(c=>!/^Le matériel|^Le client|^D'où|^Pourquoi|^Les signes/.test(c)).map((c, k) => `<div><b>${k+1}</b><span>${esc(nb(c.replace(/^(Étape|Règle|Réflexe|Critère) \d+ · /, "")))}</span></div>`).join("")}</div>`;
  }
  else if (s.type === "cta") {
    el.innerHTML = `${s.ecran ? ecranHTML(s.ecran) : ""}<div class="phones">73 12 26 12<br>54 54 28 18</div><div><span class="subbtn">▶ S'abonner</span></div>`;
  }
  else if (s.type === "tricycle") {
    el.innerHTML = `<div class="photo" style="width:${V.vertical?620:560}px;height:${V.vertical?620:520}px"><img src="${IMG}tricycle-solaire.jpg" alt=""></div><div class="big" style="--fs:54px">40 habits <em>= 2 000 F</em></div>`;
  }
  else if (s.type === "phone") {
    el.style.flexDirection = "row"; el.style.alignItems = "center"; el.style.gap = "60px";
    el.innerHTML = `<div class="phone"><div class="scr"><img src="${IMG}logo-nla.jpg" alt=""><div style="font:800 30px Figtree,Arial,sans-serif">Nouvelle Laverie Africaine</div><div class="pbtn">${esc(nb(s.ecran || "Créer mon compte client"))}</div></div></div>`;
  }
  else {
    const txt = s.ecran || (s.last ? "" : (s.chap || V.title));
    el.innerHTML = kick + (txt ? ecranHTML(txt) : "") + (s.last && !/73 12/.test(s.ecran || "") ? `<div class="phones" style="--fs:48px">73 12 26 12 · 54 54 28 18</div>` : "");
  }
  stage.appendChild(el);
});
// intro & outro
const whoName = Object.entries(WHO).find(e => e[1] === mainWho)[0];
$("intro").innerHTML = `<div class="lgbig" style="width:${V.vertical?360:300}px;height:${V.vertical?360:300}px"><img src="${IMG}logo-nla.jpg" alt=""></div>
  <div class="sr" style="font:800 34px Figtree,Arial,sans-serif;background:#D9A521;color:#141A2E;padding:8px 26px;border-radius:999px">${SERIES[V.series]}</div>
  <div class="big" style="--fs:${V.vertical?72:70}px;max-width:${V.vertical?960:1500}px;text-align:center">${esc(nb(V.title))}</div>
  <div style="font:800 36px Figtree,Arial,sans-serif;color:var(--hl)">avec ${whoName}</div>`;
$("outro").innerHTML = `<div class="lgbig" style="width:260px;height:260px"><img src="${IMG}logo-nla.jpg" alt=""></div>
  <div class="big" style="--fs:64px">Un simple coup de fil, <em>nous voici !</em></div>
  <div style="display:flex;gap:50px;align-items:center;justify-content:center;flex-wrap:wrap">
    <div class="photo" style="width:340px;height:320px"><img src="${IMG}tricycle-solaire.jpg" alt=""></div>
    <div style="display:flex;flex-direction:column;gap:18px;align-items:center">
      <div class="phones" style="--fs:58px">73 12 26 12<br>54 54 28 18</div>
      <div style="font:800 34px Figtree,Arial,sans-serif">Tous les jours · 6h30 – 20h</div>
      <span class="subbtn">▶ S'abonner</span>
    </div></div>`;

// fit text to stage
function fit(){
  const H = stage.clientHeight, Wd = stage.clientWidth;
  SC.forEach(s => {
    const el = s.el; el.style.opacity = 1;
    let fs = V.vertical ? 104 : 92;
    const targets = el.querySelectorAll(".big,.items,.recap");
    targets.forEach(x => x.style.setProperty("--fs", (x.classList.contains("recap") ? Math.round(fs*0.52) : x.classList.contains("items") ? Math.round(fs*0.66) : fs) + "px"));
    while ((el.scrollHeight > H || [...targets].some(x => x.scrollWidth > Wd)) && fs > 30) {
      fs -= 4;
      targets.forEach(x => { if (x.style.getPropertyValue("--fs") && x.closest(".photo") == null) x.style.setProperty("--fs", (x.classList.contains("recap") ? Math.round(fs*0.52) : x.classList.contains("items") ? Math.round(fs*0.66) : fs) + "px"); });
    }
    el.style.opacity = 0;
  });
}
window.prepare = async () => { await document.fonts.ready; fit(); };

// ---------- render ----------
function inout(t, a, b, f = 0.35){ return Math.min(ease((t - a) / f), ease((b - t) / f)); }
let lastChap = null;
function render(t){
  const cur = SC.find(s => t >= s.a && t < s.b);
  // intro / outro overlays
  const intro = SC.find(s => s.type === "intro");
  $("intro").style.opacity = intro ? (t < intro.b ? Math.min(1, ease((intro.b - t) / 0.4)) : 0) : 0;
  if (intro && t < intro.b) { const k = ease(t / 0.8); $("intro").style.transform = `scale(${0.96 + 0.04 * k})`; }
  $("outro").style.opacity = OUT && t >= TOTAL - OUT ? ease((t - (TOTAL - OUT)) / 0.5) : 0;
  // scenes
  SC.forEach(s => {
    if (s.type === "intro") return;
    const o = (t >= s.a - 0.01 && t <= s.b + 0.01) ? inout(t, s.a, s.b) : 0;
    s.el.style.opacity = o;
    if (o > 0) {
      const kids = s.el.querySelectorAll(".kick,.big,.item,.recap > div,.phones,.subbtn,.photo,.phone");
      kids.forEach((k, n) => { const e = ease((t - s.a - 0.15 - n * 0.35) / 0.5); k.style.opacity = e; k.style.transform = `translateY(${(1 - e) * 40}px)`; });
    }
  });
  // chapter pill
  const chap = cur && cur.chap && cur.type !== "intro" ? cur.chap : null;
  const cp = $("chap");
  if (chap !== lastChap) { cp.textContent = chap ? nb(chap) : ""; lastChap = chap; }
  cp.style.opacity = chap ? 1 : 0;
  // avatar: bob, talk, blink
  const sub = SUBS.find(x => t >= x.a && t <= x.b);
  const speaking = !!sub;
  const avEl = $("av");
  avEl.style.transform = `translateY(${Math.sin(t * 2.1) * 8}px) rotate(${Math.sin(t * 1.3) * 1.2}deg)`;
  const m = avEl.querySelector(".mouth");
  const open = speaking ? 0.35 + 0.65 * Math.abs(Math.sin(t * 13) * Math.sin(t * 5.3 + 1)) : 1;
  if (m) m.style.transform = `scaleY(${open})`;
  const blink = (t % 3.7) < 0.12 ? 0.1 : 1;
  avEl.querySelectorAll(".eye").forEach(e => e.style.transform = `scaleY(${blink})`);
  // guest
  const g = $("guest");
  if (hasGuest) { const on = cur && cur.guest; g.style.opacity = on ? ease((t - cur.a) / 0.5) : 0; g.style.transform = `translateY(${Math.sin(t * 2.4 + 1) * 6}px)`; }
  // subtitles
  $("sub").textContent = sub ? sub.text : "";
  $("sub").parentElement.style.opacity = sub && $("intro").style.opacity < 0.5 && $("outro").style.opacity < 0.5 ? 1 : 0;
}
window.render = render;
</script></body></html>
