<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Figtree:wght@600;700&display=swap">
<style>
  html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
  body{position:relative;background:#0F4A9C;font-family:"Figtree",Arial,sans-serif;color:#fff}
  .stripes{position:absolute;left:0;right:0;height:300px;background:repeating-linear-gradient(90deg,
    #0F4A9C 0 76px,#FFFFFF 76px 84px,#0F4A9C 84px 120px,#D9A521 120px 132px,
    #1E9BD7 132px 192px,#0A3573 192px 200px,#1E9BD7 200px 224px,#FFFFFF 224px 232px,
    #3D9A4F 232px 280px,#D9A521 280px 292px,#3D9A4F 292px 312px,#FFFFFF 312px 320px)}
  .stripes::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 4px,transparent 4px 12px)}
  .top{top:0}.bottom{bottom:0}
  .band{position:absolute;left:0;right:0;top:300px;bottom:300px;
    background:radial-gradient(ellipse at 50% 50%,#1E6FC4 0%,#0F4A9C 55%,#0A3573 100%)}
  .gold{position:absolute;left:0;right:0;height:14px;background:#D9A521}
  .g1{top:300px}.g2{bottom:300px}
  .safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;gap:48px}
  .logo{width:360px;height:360px;border-radius:50%;background:#fff;overflow:hidden;flex:none;box-shadow:0 0 0 10px rgba(255,255,255,.18)}
  .logo img{width:100%;height:100%;object-fit:cover}
  .txt{display:grid;gap:14px}
  h1{margin:0;font:800 88px/0.98 "Unbounded","Arial Black",sans-serif;letter-spacing:-.01em}
  h1 span{color:#D9A521}
  .slogan{font:700 40px "Figtree",Arial,sans-serif;color:#CFE6FA}
  .tags{font:700 30px "Figtree",Arial,sans-serif;display:flex;gap:14px;flex-wrap:wrap}
  .tags b{background:#fff;color:#0A3573;padding:6px 18px;border-radius:999px}
  .side{position:absolute;top:528px;width:400px;height:384px;background:#fff;border-radius:32px;overflow:hidden;display:grid;place-items:center}
  .side img{width:100%;height:100%;object-fit:contain}
  .left{left:60px}.right{right:60px}
  .tel{position:absolute;right:120px;bottom:360px;font:700 34px "Figtree",Arial,sans-serif;color:#fff;opacity:.95}
  .guide{display:none;position:absolute;border:4px dashed #ff2d55}
  body.show .guide{display:block}
</style></head><body>
  <div class="stripes top"></div><div class="band"></div><div class="stripes bottom"></div>
  <div class="gold g1"></div><div class="gold g2"></div>
  <div class="side left"><img src="../assets/tricycle-conductrice.jpg" alt=""></div>
  <div class="side right"><img src="../assets/tricycle-solaire.jpg" alt=""></div>
  <div class="safe">
    <div class="logo"><img src="../assets/logo-nla.jpg" alt=""></div>
    <div class="txt">
      <h1>NOUVELLE LAVERIE<br><span>AFRICAINE</span></h1>
      <div class="slogan">Un simple coup de fil, nous voici !</div>
      <div class="tags"><b>Astuces</b><b>Formations</b><b>Lavage mobile</b><b>Pressing</b><b>Auto-moto</b></div>
    </div>
  </div>
  <div class="guide" style="left:507px;top:508px;width:1546px;height:423px"></div>
  <div class="guide" style="left:0;top:508px;width:2560px;height:423px;border-color:#ffd60a"></div>
</body></html>
