<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>DREAD ROYAL</title>
<style>
  html,body{margin:0;height:100%;background:#0B0B0B;color:#D4AF37;font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;-webkit-user-select:none}
  img{width:220px;border-radius:24px;box-shadow:0 0 50px rgba(212,175,55,.35)}
  p{margin-top:28px;font-size:14px;color:#ccc}#msg{color:#D4AF37}
  .bar{width:220px;height:4px;background:#222;border-radius:4px;overflow:hidden;margin-top:12px}
  .bar div{width:40%;height:100%;background:#D4AF37;animation:m 1.2s infinite ease-in-out}
  @keyframes m{0%{margin-left:-40%}100%{margin-left:100%}}
</style></head>
<body><img src="logo.jpg" alt="DREAD ROYAL"><p id="msg">Démarrage…</p><div class="bar"><div></div></div>
<p style="font-style:italic;font-size:12px">« Votre couronne, votre identité. »</p></body></html>
