<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d">
  <title id="t">Enseignante burkinabè préparant ses fiches</title>
  <desc id="d">Une enseignante en pagne Faso Dan Fani, assise à son bureau, remplit des fiches pédagogiques devant le tableau noir de sa classe, avec un téléphone ouvert sur PÉDAGOGUE.IA et un petit drapeau du Burkina Faso.</desc>
  <defs>
    <!-- Motif rayé du Faso Dan Fani -->
    <pattern id="danfani" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#00843d"/>
      <rect x="0" width="3" height="18" fill="#f2b705"/>
      <rect x="6" width="2" height="18" fill="#c8102e"/>
      <rect x="11" width="2" height="18" fill="#17202a"/>
      <rect x="15" width="1.5" height="18" fill="#ffffff" opacity=".7"/>
    </pattern>
    <pattern id="danfani2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="14" height="14" fill="#c8102e"/>
      <rect width="3" height="14" fill="#f2b705"/>
      <rect x="7" width="2" height="14" fill="#17202a"/>
    </pattern>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <clipPath id="cadre"><rect width="480" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#cadre)">

  <!-- Mur -->
  <rect width="480" height="360" rx="24" fill="#fbf3e4"/>
  <rect y="230" width="480" height="130" fill="#f1e2c6"/>

  <!-- Tableau noir -->
  <rect x="44" y="34" width="232" height="128" rx="6" fill="#8b5a2b"/>
  <rect x="52" y="42" width="216" height="112" rx="3" fill="#24503c"/>
  <text x="66" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f4f1e8">Fiche pédagogique</text>
  <text x="66" y="88" font-family="Arial, sans-serif" font-size="11" fill="#f4f1e8" opacity=".9">Classe : CM2 · Calcul</text>
  <path d="M66 104h120M66 118h150M66 132h96" stroke="#f4f1e8" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <rect x="118" y="154" width="40" height="6" rx="2" fill="#f4f1e8"/>

  <!-- Fenêtre et soleil -->
  <rect x="318" y="40" width="118" height="92" rx="6" fill="#a8743f"/>
  <rect x="325" y="47" width="104" height="78" rx="3" fill="url(#ciel)"/>
  <circle cx="400" cy="74" r="15" fill="#f2b705"/>
  <path d="M325 112c20-12 38-10 56-2s34 6 48-4v19H325z" fill="#9bbf63"/>
  <path d="M377 47v78M325 86h104" stroke="#a8743f" stroke-width="5"/>

  <!-- Chaise (dossier) -->
  <rect x="176" y="150" width="128" height="96" rx="14" fill="#7a4a22"/>

  <!-- Buste en Faso Dan Fani -->
  <path d="M168 262c0-52 20-82 72-82s72 30 72 82z" fill="url(#danfani)"/>
  <path d="M222 182l18 26 18-26z" fill="#6b3e26"/>
  <path d="M220 180c6 12 34 12 40 0" fill="none" stroke="#f2b705" stroke-width="4"/>

  <!-- Cou et tête -->
  <rect x="230" y="160" width="20" height="26" rx="8" fill="#6b3e26"/>
  <ellipse cx="240" cy="134" rx="29" ry="33" fill="#7a4a2e"/>
  <!-- Foulard -->
  <path d="M209 128c-4-30 14-50 32-50s36 18 32 50c-6-14-18-22-32-22s-26 8-32 22z" fill="url(#danfani2)"/>
  <path d="M266 92c12-10 26-6 28 6-8-2-16 0-22 6z" fill="#c8102e"/>
  <path d="M268 96c10 2 16 10 14 20-4-8-10-12-18-12z" fill="#f2b705"/>
  <!-- Visage, regard baissé vers les fiches -->
  <path d="M226 138q5 4 10 0M245 138q5 4 10 0" fill="none" stroke="#2b1a10" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M233 154q7 5 14 0" fill="none" stroke="#2b1a10" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="211" cy="146" r="3.5" fill="#f2b705"/>
  <circle cx="269" cy="146" r="3.5" fill="#f2b705"/>

  <!-- Bureau -->
  <path d="M24 248h432l18 30H6z" fill="#c98a4b"/>
  <rect x="6" y="278" width="468" height="12" fill="#a8692f"/>
  <rect x="40" y="290" width="400" height="58" fill="#8b5a2b"/>
  <rect x="58" y="304" width="110" height="30" rx="4" fill="#7a4a22"/>
  <circle cx="113" cy="319" r="3" fill="#f2b705"/>

  <!-- Pile de fiches -->
  <path d="M60 252h86l8 18H52z" fill="#e9e4d8"/>
  <path d="M62 247h86l8 18H54z" fill="#f4f0e6"/>
  <path d="M64 242h86l8 18H56z" fill="#ffffff" stroke="#e2e6ea"/>
  <rect x="76" y="238" width="14" height="8" rx="1.5" fill="#00843d"/>
  <rect x="94" y="238" width="14" height="8" rx="1.5" fill="#f2b705"/>
  <rect x="112" y="238" width="14" height="8" rx="1.5" fill="#c8102e"/>

  <!-- Fiche en cours de rédaction -->
  <path d="M190 244h104l10 26H178z" fill="#ffffff" stroke="#d9dee3"/>
  <path d="M196 251h40M194 257h70M192 263h56" stroke="#00843d" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M244 251h30" stroke="#9aa3ad" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Bras et mains -->
  <path d="M182 214c-14 18-12 36 2 46" fill="none" stroke="url(#danfani)" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="196" cy="258" rx="12" ry="8" fill="#7a4a2e"/>
  <path d="M298 214c12 18 6 34-12 42" fill="none" stroke="url(#danfani)" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="274" cy="258" rx="12" ry="8" fill="#7a4a2e"/>
  <!-- Stylo -->
  <path d="M262 266l22-28" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
  <path d="M262 266l3-6" stroke="#c8102e" stroke-width="4" stroke-linecap="round"/>

  <!-- Téléphone avec PÉDAGOGUE.IA -->
  <rect x="352" y="196" width="40" height="64" rx="7" fill="#17202a"/>
  <rect x="356" y="203" width="32" height="50" rx="3" fill="#00843d"/>
  <rect x="362" y="210" width="20" height="14" rx="3" fill="#ffffff"/>
  <path d="M367 217l3 3 6-6" fill="none" stroke="#00843d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M362 232h20M362 238h14M362 244h18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
  <path d="M346 260h52l4 8h-60z" fill="#5b3a1d"/>

  <!-- Petit drapeau du Burkina Faso -->
  <rect x="420" y="214" width="3" height="46" rx="1.5" fill="#5b6573"/>
  <rect x="423" y="214" width="34" height="11" fill="#c8102e"/>
  <rect x="423" y="225" width="34" height="11" fill="#00843d"/>
  <path d="M440 220.5l1.6 3.4 3.7.4-2.8 2.5.8 3.6-3.3-1.9-3.3 1.9.8-3.6-2.8-2.5 3.7-.4z" fill="#f2b705"/>
  <ellipse cx="421.5" cy="261" rx="9" ry="3" fill="#5b6573"/>

  <!-- Tasse -->
  <path d="M318 246h22v16a6 6 0 0 1-6 6h-10a6 6 0 0 1-6-6z" fill="#ffffff" stroke="#d9dee3"/>
  <path d="M340 251a6 6 0 0 1 0 10" fill="none" stroke="#d9dee3" stroke-width="3"/>
  <path d="M325 238c-3-4 3-6 0-10M333 238c-3-4 3-6 0-10" fill="none" stroke="#c9b9a0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
