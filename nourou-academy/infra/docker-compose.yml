# Développement : base PostgreSQL + pgvector.
#   docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nourou
      POSTGRES_PASSWORD: nourou_dev_pwd
      POSTGRES_DB: nourou_academy
    ports: ["5432:5432"]
    volumes: [nourou_pg:/var/lib/postgresql/data]
volumes:
  nourou_pg:
